<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AttendPro · Преподаватель</title>
<style>body{background:#071426;color:#edf5ff;font:17px system-ui;max-width:760px;margin:40px auto;padding:0 20px}section{background:#13243b;padding:22px;margin:20px 0;border-radius:16px}h1{margin-bottom:8px}input,button{font:inherit;padding:12px;margin:6px 0;border-radius:9px;border:1px solid #456;background:#092039;color:inherit}input{box-sizing:border-box;width:100%}button{cursor:pointer;background:#175d8f}button:disabled{opacity:.5}li{padding:7px}a{color:#8edcff}#message{white-space:pre-wrap}small{color:#aebdd2}</style>
<h1>AttendPro</h1><small>Хаб преподавателя · BLE MVP</small>
<section><label>Ключ консоли<input id="token" type="password" autocomplete="off" placeholder="Из файла hub/data/admin-token"></label><button id="connect">Подключиться</button><p id="status">Введите ключ консоли</p></section>
<section><h2>Занятие</h2><input id="name" placeholder="Название пары" maxlength="80"><button id="start">Начать пару</button> <button id="rotate">Новое окно отметок</button> <button id="close">Завершить пару</button></section>
<section><h2>Пригласить студента</h2><input id="student" placeholder="Имя студента" maxlength="100"><button id="invite">Создать приглашение</button><p id="code"></p><small>На телефоне откройте приложение, введите адрес этого хаба и код приглашения. Затем нажмите «Отметиться» рядом с хабом.</small></section>
<section><h2>Принятые отметки</h2><ul id="roster"></ul><button id="export">Скачать доказательства</button></section>
<p role="status" id="message"></p><a href="/student/index.html">Открыть приложение студента</a>
<script>
const el=id=>document.getElementById(id);
async function api(route, body){const response=await fetch('/api/'+route,{method:body?'POST':'GET',headers:{authorization:'Bearer '+el('token').value,'content-type':'application/json'},body:body?JSON.stringify(body):undefined});const data=await response.json();if(!response.ok)throw Error(data.error);return data}
async function refresh(){const s=await api('status');el('status').textContent=`BLE: ${s.radio} · ${s.session_name||'пара не начата'} · ${s.closed?'завершена':'окно '+s.epoch}`;el('roster').replaceChildren(...s.accepted.map(r=>{const li=document.createElement('li');li.textContent=`${r.receive_seq}. ${r.student_name}`;return li}))}
function action(id,fn){el(id).onclick=async()=>{el(id).disabled=true;try{el('message').textContent='';await fn();await refresh()}catch(e){el('message').textContent=e.message}finally{el(id).disabled=false}}}
action('connect',refresh);action('start',()=>api('start',{session_name:el('name').value}));action('rotate',()=>api('rotate',{}));action('close',()=>api('close',{}));action('invite',async()=>{const r=await api('invite',{student_name:el('student').value});el('code').textContent=`${r.student_name}: ${r.code} · Адрес хаба: ${location.origin}`});action('export',async()=>{const r=await api('export'),u=URL.createObjectURL(new Blob([JSON.stringify(r,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='attendpro-evidence.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)});setInterval(()=>{if(el('token').value)refresh().catch(e=>el('message').textContent=e.message)},3000);
</script></html>
